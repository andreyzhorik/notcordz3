<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notcord Ultimate</title>
    
    <!-- Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>

    <style>
        :root {
            --primary-bg: #0f1014;
            --sidebar-bg: #0b0c10;
            --accent-color: #00e1ff;
            --text-main: #e0e0e0;
            --bubble-bg: #1a1b22;
            --channel-active: #2a2b35;
            --online-status: #3ba55c;
            --danger: #ff4757;
        }

        /* Essential Reset & Layout */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background: var(--primary-bg); color: var(--text-main); height: 100vh; display: flex; overflow: hidden; }
        
        /* Scrollbar Styling */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent-color); }

        /* --- Sidebar & User List --- */
        .sidebar { width: 300px; background: var(--sidebar-bg); display: flex; flex-direction: column; border-right: 1px solid #222; }
        .sidebar-header { padding: 30px 20px 10px; font-size: 0.65em; text-transform: uppercase; letter-spacing: 1.5px; color: #555; font-weight: 800; }
        .channel-item { padding: 10px 20px; cursor: pointer; margin: 4px 12px; border-radius: 6px; color: #888; display: flex; align-items: center; gap: 12px; transition: 0.2s; }
        .channel-item:hover { background: rgba(255,255,255,0.03); color: #fff; }
        .channel-item.active { background: var(--channel-active); color: #fff; border-left: 3px solid var(--accent-color); }
        .user-list { flex-grow: 1; margin-top: 20px; border-top: 1px solid #222; padding: 20px; overflow-y: auto; }
        .user-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; font-size: 0.85em; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; }

        /* --- Chat Interface --- */
        .chat-container { flex-grow: 1; display: flex; flex-direction: column; position: relative; }
        .chat-header { padding: 18px 25px; border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.1); }
        #messages { flex-grow: 1; overflow-y: auto; padding: 25px 35px; display: flex; flex-direction: column; gap: 18px; }

        /* Message Bubbles */
        .msg-bubble { background: var(--bubble-bg); padding: 16px; border-radius: 12px; max-width: 85%; width: fit-content; border: 1px solid transparent; transition: 0.2s; cursor: pointer; animation: fadeIn 0.3s ease forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .msg-bubble:hover { border-color: #333; }
        .msg-mention { border-left: 4px solid #f1c40f !important; background: rgba(241, 196, 15, 0.03) !important; }
        
        .reply-notif { font-size: 0.75em; opacity: 0.5; margin-bottom: 8px; border-left: 2px solid #555; padding-left: 10px; font-style: italic; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .msg-info { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
        .msg-ava { width: 32px; height: 32px; border-radius: 50%; background: #222; object-fit: cover; }
        .msg-user { font-weight: bold; font-size: 0.95em; }
        .msg-time { font-size: 0.7em; opacity: 0.4; }

        /* Media Handling */
        .photo-card { width: 100%; max-width: 550px; border-radius: 10px; margin-top: 12px; border: 1px solid #333; }
        .code-container { position: relative; max-height: 220px; overflow: hidden; margin-top: 10px; border-radius: 8px; transition: max-height 0.3s; }
        .code-container.expanded { max-height: 5000px; }
        .expand-code { position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(transparent, #000); color: var(--accent-color); padding: 25px 0 5px; text-align: center; font-size: 0.7em; font-weight: bold; cursor: pointer; border: none; width: 100%; }
        .code-container.expanded .expand-code { position: static; background: #222; padding: 5px; }

        /* --- Footer & Input --- */
        .chat-footer { padding: 20px 35px 35px; background: var(--primary-bg); }
        .reply-ref { display: none; background: #222; padding: 10px 15px; border-radius: 10px 10px 0 0; border: 1px solid #333; border-bottom: none; font-size: 0.8em; justify-content: space-between; }
        .input-bar { display: flex; gap: 12px; background: rgba(255,255,255,0.03); padding: 14px 20px; border-radius: 12px; border: 1px solid #333; align-items: center; }
        .input-bar input { flex-grow: 1; background: transparent; border: none; color: #fff; outline: none; }
        .upload-btn { cursor: pointer; opacity: 0.6; transition: 0.2s; }
        .upload-btn:hover { opacity: 1; color: var(--accent-color); }

        /* --- Settings Modal --- */
        #settings { position: absolute; right: 35px; top: 85px; background: #181920; border: 1px solid #333; border-radius: 15px; width: 340px; padding: 25px; z-index: 999; display: none; box-shadow: 0 20px 60px rgba(0,0,0,0.8); }
        .form-group { margin-bottom: 18px; }
        label { display: block; font-size: 0.65em; text-transform: uppercase; color: #666; font-weight: bold; margin-bottom: 8px; }
        .form-input { width: 100%; background: #0c0d12; border: 1px solid #333; padding: 12px; color: #fff; border-radius: 8px; outline: none; }
        .theme-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .swatch { display: flex; flex-direction: column; align-items: center; font-size: 0.6em; gap: 5px; }
        input[type="color"] { width: 100%; height: 35px; border: none; background: transparent; cursor: pointer; }
        .save-btn { width: 100%; padding: 14px; background: var(--accent-color); color: #000; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; margin-top: 10px; }

        /* Notification Toast */
        #toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: var(--accent-color); color: #000; padding: 10px 25px; border-radius: 30px; font-weight: bold; font-size: 0.85em; z-index: 10000; display: none; }
    </style>
</head>
<body>

    <div id="toast"></div>

    <aside class="sidebar">
        <header class="sidebar-header">Server Network</header>
        <div id="channelList">
            <div class="channel-item active" data-ch="general"><span>#</span> general</div>
            <div class="channel-item" data-ch="photos"><span>📸</span> photos</div>
            <div class="channel-item" data-ch="code"><span>💻</span> code</div>
        </div>
        <div class="user-list">
            <header class="sidebar-header" id="online-count">Online — 0</header>
            <div id="users"></div>
        </div>
    </aside>

    <main class="chat-container">
        <header class="chat-header">
            <div><strong id="ch-name"># general</strong> <span id="status-pill" style="font-size:0.7em; opacity:0.5; margin-left:10px">● Syncing</span></div>
            <div id="openSettings" style="cursor:pointer; font-size:1.3em">⚙️</div>
        </header>

        <section id="messages"></section>

        <footer class="chat-footer">
            <div id="replyBar" class="reply-ref">
                <span id="replyContent"></span>
                <span id="closeReply" style="cursor:pointer">✕</span>
            </div>
            <div class="input-bar">
                <label for="fileUpload" class="upload-btn" id="uploadLabel">📎</label>
                <input type="file" id="fileUpload" style="display:none" accept="image/*">
                
                <select id="langChoice" style="display:none; background:#222; color:#fff; border:none; border-radius:4px; font-size:0.7em">
                    <option value="javascript">JS</option>
                    <option value="python">PY</option>
                    <option value="css">CSS</option>
                    <option value="html">HTML</option>
                </select>

                <input type="text" id="msgBtn" placeholder="Message #general...">
                <button id="sendAction" style="background:var(--accent-color); border:none; padding:8px 18px; border-radius:8px; font-weight:bold; cursor:pointer">Send</button>
            </div>
        </footer>

        <div id="settings">
            <h3 style="margin-bottom:20px">Identity Config</h3>
            <div class="form-group">
                <label>User Handle</label>
                <input type="text" id="pref-name" class="form-input" placeholder="Set name...">
            </div>
            <div class="form-group">
                <label>Avatar Endpoint</label>
                <input type="text" id="pref-ava" class="form-input" placeholder="https://...">
            </div>
            <div class="form-group">
                <label>Master Theme</label>
                <div class="theme-grid">
                    <div class="swatch"><input type="color" id="thm-name"><label>Name</label></div>
                    <div class="swatch"><input type="color" id="thm-accent"><label>Accent</label></div>
                    <div class="swatch"><input type="color" id="thm-bg"><label>Page</label></div>
                    <div class="swatch"><input type="color" id="thm-side"><label>Side</label></div>
                    <div class="swatch"><input type="color" id="thm-bubble"><label>Bubble</label></div>
                    <div class="swatch"><input type="color" id="thm-text"><label>Text</label></div>
                </div>
            </div>
            <button class="save-btn" id="savePrefs">Apply & Sync</button>
        </div>
    </main>

    <script>
        /**
         * NOTCORD ENGINE MASTER
         */

        const API = {
            chat: 'https://68e839b2f2707e6128ca35e1.mockapi.io/chat',
            photos: 'https://68eeed86b06cc802829ba196.mockapi.io/photos',
            code: 'https://68eeed86b06cc802829ba196.mockapi.io/code',
            players: 'https://68e839b2f2707e6128ca35e1.mockapi.io/players'
        };

        // --- App State ---
        let currentCh = 'general';
        let replyCtx = null;
        let knownMsgIds = new Set();
        let messageTimes = []; // Anti-spam tracking

        let user = JSON.parse(localStorage.getItem('notcord_pro_v5')) || {
            id: null,
            name: 'noname',
            nameColor: '#00e1ff',
            accent: '#00e1ff',
            bg: '#0f1014',
            side: '#0b0c10',
            bubble: '#1a1b22',
            text: '#e0e0e0',
            avatar: ''
        };

        // --- Security Core ---
        const badWords = ['spam', 'badword', 'offensive']; // Extend as needed
        const censor = (str) => {
            let res = str;
            badWords.forEach(w => {
                const reg = new RegExp(w, 'gi');
                res = res.replace(reg, '*'.repeat(w.length));
            });
            return res;
        };

        const validateColor = (c) => /^#[0-9A-F]{6}$/i.test(c) ? c : '#fff';

        const updateTheme = () => {
            const r = document.documentElement.style;
            r.setProperty('--accent-color', validateColor(user.accent));
            r.setProperty('--primary-bg', validateColor(user.bg));
            r.setProperty('--sidebar-bg', validateColor(user.side));
            r.setProperty('--bubble-bg', validateColor(user.bubble));
            r.setProperty('--text-main', validateColor(user.text));
        };

        // --- Core UI Logic ---
        
        async function fetchFeed() {
            try {
                const endpoint = currentCh === 'general' ? API.chat : API[currentCh];
                const { data } = await axios.get(endpoint);
                const container = document.getElementById('messages');
                
                // Optimized List: Keep latest 90 (per user request)
                const displayData = data.slice(-90);
                const isAtBottom = container.scrollHeight - container.scrollTop <= container.clientHeight + 200;

                container.innerHTML = '';
                displayData.forEach(msg => {
                    const rawText = msg.message || msg.content || msg.code || msg.imageUrl || '';
                    const cleanText = censor(rawText);
                    const author = DOMPurify.sanitize(msg.username || msg.name || 'User');
                    
                    // Ping Notification Logic
                    if (!knownMsgIds.has(msg.id)) {
                        knownMsgIds.add(msg.id);
                        if (cleanText.toLowerCase().includes(`@${user.name.toLowerCase()}`)) {
                            showNotification(author, cleanText);
                        }
                    }

                    const bubble = document.createElement('div');
                    bubble.className = `msg-bubble ${cleanText.includes(`@${user.name}`) ? 'msg-mention' : ''}`;
                    
                    let body = (msg.replyTo) ? `<div class="reply-notif">Reply: "${DOMPurify.sanitize(msg.replySnippet || '...')}"</div>` : '';
                    body += `
                        <div class="msg-info">
                            <img src="${(msg.avatarUrl && msg.avatarUrl !== 'null') ? DOMPurify.sanitize(msg.avatarUrl) : 'https://www.gravatar.com/avatar/0?d=mp'}" class="msg-ava">
                            <span class="msg-user" style="color:${validateColor(msg.nameColor || '#fff')}">${author}</span>
                            <span class="msg-time">${new Date(msg.createdAt).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</span>
                        </div>
                    `;

                    if (currentCh === 'photos') {
                        body += `<img src="${DOMPurify.sanitize(cleanText)}" class="photo-card" onerror="this.src='https://placehold.co/400x200?text=Invalid+Image'">`;
                    } else if (currentCh === 'code') {
                        body += `
                            <div class="code-container" id="code-${msg.id}">
                                <pre class="language-${msg.language || 'javascript'}"><code>${DOMPurify.sanitize(cleanText)}</code></pre>
                                <button class="expand-code" data-target="${msg.id}">Expand Snippet</button>
                            </div>`;
                    } else {
                        body += `<div class="markdown-body">${DOMPurify.sanitize(marked.parse(cleanText))}</div>`;
                    }

                    bubble.innerHTML = body;
                    bubble.addEventListener('click', (e) => {
                        if(e.target.classList.contains('expand-code')) {
                            document.getElementById(`code-${e.target.dataset.target}`).classList.toggle('expanded');
                            e.stopPropagation();
                        } else {
                            initReply(author, msg.id, cleanText);
                        }
                    });
                    container.appendChild(bubble);
                });

                if(isAtBottom) container.scrollTop = container.scrollHeight;
                Prism.highlightAll();
                document.getElementById('status-pill').innerText = '● Synced';
                document.getElementById('status-pill').style.color = '#3ba55c';
            } catch (err) {
                document.getElementById('status-pill').innerText = '● Connection Lost';
                document.getElementById('status-pill').style.color = '#ff4757';
            }
        }

        async function dispatch() {
            const input = document.getElementById('msgBtn');
            const content = input.value.trim();
            if (!content) return;

            // Anti-Spam Check: 3 msgs in 10s
            const now = Date.now();
            messageTimes = messageTimes.filter(t => now - t < 10000);
            if (messageTimes.length >= 3) {
                return toast("Slow down! You are sending too many messages.");
            }
            messageTimes.push(now);

            document.getElementById('sendAction').innerText = '...';
            
            const payload = {
                username: user.name,
                nameColor: user.nameColor,
                avatarUrl: user.avatar || 'null',
                replyTo: replyCtx ? replyCtx.id : null,
                replySnippet: replyCtx ? replyCtx.snip : null,
                createdAt: new Date().toISOString()
            };

            if (currentCh === 'general') payload.message = content;
            else if (currentCh === 'photos') payload.imageUrl = content;
            else if (currentCh === 'code') {
                payload.code = content;
                payload.language = document.getElementById('langChoice').value;
                payload.isCode = true;
            }

            try {
                await axios.post((currentCh === 'general' ? API.chat : API[currentCh]), payload);
                input.value = '';
                cancelReply();
                fetchFeed();
            } catch(e) { toast("Failed to send message."); }
            document.getElementById('sendAction').innerText = 'Send';
        }

        // --- Presence & Sync ---

        async function pulseSync() {
            const bundle = {
                name: user.name,
                nameColor: user.nameColor,
                avatarUrl: user.avatar || 'null',
                lastSeen: new Date().toISOString(),
                online: true
            };

            try {
                if (user.id) {
                    await axios.put(`${API.players}/${user.id}`, bundle);
                } else {
                    const res = await axios.post(API.players, bundle);
                    user.id = res.data.id;
                    localStorage.setItem('notcord_pro_v5', JSON.stringify(user));
                }
            } catch (e) {
                const { data } = await axios.get(API.players);
                const existing = data.find(p => p.name === user.name);
                if (existing) {
                    user.id = existing.id;
                    await axios.put(`${API.players}/${user.id}`, bundle);
                }
            }

            const activePlayers = await axios.get(API.players);
            renderUsers(activePlayers.data);
        }

        function renderUsers(ps) {
            const container = document.getElementById('users');
            const now = new Date();
            const online = ps.filter(p => (now - new Date(p.lastSeen)) < 35000);
            document.getElementById('online-count').innerText = `Online — ${online.length}`;

            container.innerHTML = ps.map(p => {
                const active = (now - new Date(p.lastSeen)) < 35000;
                return `
                    <div class="user-row">
                        <div class="status-dot ${active ? 'online' : 'offline'}"></div>
                        <span style="color:${validateColor(p.nameColor || '#fff')}">${DOMPurify.sanitize(p.name)}</span>
                    </div>
                `;
            }).join('');
        }

        // --- Utilities ---

        const initReply = (name, id, snip) => {
            replyCtx = { id, snip: snip.substring(0, 30) + (snip.length > 30 ? '...' : '') };
            document.getElementById('replyBar').style.display = 'flex';
            document.getElementById('replyContent').innerText = `Replying to @${name}`;
            document.getElementById('msgBtn').focus();
        };

        const cancelReply = () => {
            replyCtx = null;
            document.getElementById('replyBar').style.display = 'none';
        };

        const toast = (msg) => {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 3000);
        };

        const showNotification = (author, text) => {
            if ("Notification" in window && Notification.permission === "granted") {
                new Notification(`New Ping from ${author}`, { body: text.substring(0, 50) });
            }
        };

        // File to Base64 (Upload Simulation)
        document.getElementById('fileUpload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            if (file.size > 2000000) return toast("File too big! Keep under 2MB");

            const reader = new FileReader();
            reader.onloadstart = () => document.getElementById('uploadLabel').innerText = '...';
            reader.onload = async function() {
                document.getElementById('msgBtn').value = reader.result;
                document.getElementById('uploadLabel').innerText = '📎';
                toast("Image loaded! Press enter to upload.");
            };
            reader.readAsDataURL(file);
        });

        // --- Event Listeners ---

        document.getElementById('savePrefs').addEventListener('click', async () => {
            const newName = document.getElementById('pref-name').value.trim();
            if (!newName) return toast("Username required");

            // Unique Name Enforcement
            const { data } = await axios.get(API.players);
            const taken = data.find(p => p.name.toLowerCase() === newName.toLowerCase() && p.id !== user.id);
            if (taken) return toast("Name already taken! Choose another.");

            user.name = newName;
            user.avatar = document.getElementById('pref-ava').value;
            user.nameColor = document.getElementById('thm-name').value;
            user.accent = document.getElementById('thm-accent').value;
            user.bg = document.getElementById('thm-bg').value;
            user.side = document.getElementById('thm-side').value;
            user.bubble = document.getElementById('thm-bubble').value;
            user.text = document.getElementById('thm-text').value;

            localStorage.setItem('notcord_pro_v5', JSON.stringify(user));
            updateTheme();
            document.getElementById('settings').style.display = 'none';
            pulseSync();
            toast("Profile Synchronized.");
        });

        document.getElementById('openSettings').addEventListener('click', () => {
            const s = document.getElementById('settings');
            const show = s.style.display !== 'block';
            s.style.display = show ? 'block' : 'none';
            if (show) {
                document.getElementById('pref-name').value = user.name;
                document.getElementById('pref-ava').value = user.avatar === 'null' ? '' : user.avatar;
                document.getElementById('thm-name').value = user.nameColor;
                document.getElementById('thm-accent').value = user.accent;
                document.getElementById('thm-bg').value = user.bg;
                document.getElementById('thm-side').value = user.side;
                document.getElementById('thm-bubble').value = user.bubble;
                document.getElementById('thm-text').value = user.text;
            }
        });

        document.querySelectorAll('.channel-item').forEach(item => {
            item.addEventListener('click', () => {
                currentCh = item.dataset.ch;
                document.querySelectorAll('.channel-item').forEach(i => i.classList.remove('active'));
                item.classList.add('active');
                document.getElementById('ch-name').innerText = `# ${currentCh}`;
                document.getElementById('msgBtn').placeholder = `Message #${currentCh}...`;
                document.getElementById('langChoice').style.display = (currentCh === 'code') ? 'block' : 'none';
                lastCount = 0;
                fetchFeed();
            });
        });

        document.getElementById('sendAction').addEventListener('click', dispatch);
        document.getElementById('msgBtn').addEventListener('keypress', (e) => e.key === 'Enter' && dispatch());
        document.getElementById('closeReply').addEventListener('click', cancelReply);

        // --- Boot Routine ---
        marked.setOptions({ gfm: true, breaks: true, sanitize: false }); // DOMPurify handles sanitize
        if (Notification.permission === "default") Notification.requestPermission();
        
        if (user.name === 'noname') {
            setTimeout(() => {
                document.getElementById('openSettings').click();
                toast("Please set your unique username!");
            }, 1000);
        }

        updateTheme();
        setInterval(fetchFeed, 3500);
        setInterval(pulseSync, 10000);
        fetchFeed();
        pulseSync();

    </script>
</body>
</html>
